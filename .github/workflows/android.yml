
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        run: |
          ls -la skaes-android
          test -f skaes-android/settings.gradle
          test -f skaes-android/app/build.gradle

      - name: Build Debug APK
        working-directory: skaes-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKAES-Distribusiku-APK
          path: skaes-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
